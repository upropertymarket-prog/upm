name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # Valores de placeholder: o build precisa das variáveis definidas, mas o CI
  # não toca em Supabase real. Os E2E contra staging (02 §14) usam secrets.
  NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder-anon-key

jobs:
  verify:
    name: lint · typecheck · test · build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Formatação
        run: pnpm format:check

      - name: Lint
        run: pnpm lint

      - name: Typecheck
        run: pnpm typecheck

      - name: Testes unitários
        run: pnpm test

      - name: Build das 3 apps
        run: pnpm build

      # Portão de fim de fase, parte automatizável — doc 08 §8.
      - name: Portão · variáveis NEXT_PUBLIC_
        run: pnpm gate:env

      - name: Portão · segredos no bundle do cliente
        run: pnpm gate:bundle

      # 02 §13 (360 px → 1920 px). Só a parte estática: o medidor que abre as
      # storyboards num browser (`pnpm audit:responsive`) precisa do host dos
      # canvases, que é gerado pela app Tempo e não existe num checkout limpo.
      - name: Portão · grelhas e ellipsis responsivos
        run: pnpm gate:responsive

      # 04 §2.1.2 AC #5 — uma rota pública sem `seo.ts` falha o PR. Uma página
      # que entra em produção sem título nem cartão de partilha só se descobre
      # quando alguém partilha o link, que é tarde.
      - name: Portão · SEO por rota pública
        run: pnpm gate:seo

      - name: Portão · dependências vulneráveis
        run: pnpm gate:deps

  secrets:
    name: segredos no histórico
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
