project_id = "upropertymarket"

[api]
enabled = true
port = 54321
schemas = ["public", "storage", "graphql_public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
shadow_port = 54320
major_version = 17

[studio]
enabled = true
port = 54323

[local_smtp]
enabled = true
port = 54324

[storage]
enabled = true
file_size_limit = "50MiB"

[auth]
enabled = true
site_url = "http://localhost:4301"
additional_redirect_urls = ["http://localhost:4300", "http://localhost:4302"]
jwt_expiry = 3600
enable_signup = true

[auth.email]
enable_signup = true
enable_confirmations = true

[analytics]
enabled = false

# A fila de e-mails no pré-lançamento (7 nov 2026): `supabase/functions/outbox`.
# Sem verificação de JWT de propósito — a chave pública é um JWT válido e está
# em todos os browsers. A função exige o seu próprio segredo (ver o ficheiro).
[functions.outbox]
verify_jwt = false
